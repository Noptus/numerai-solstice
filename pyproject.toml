[project]
name = "numerai-solstice"
version = "0.6.1"
description = "Reproducible Numerai v6 research with purged validation and official scoring"
requires-python = ">=3.12"
dependencies = [
  "numpy>=2.0", "pandas>=2.2", "scipy>=1.14", "scikit-learn>=1.5",
  "lightgbm>=4.6", "pyarrow>=18", "numerapi>=3.1.1", "numerai-tools==0.7.2",
  "python-dotenv>=1.0", "threadpoolctl>=3.5"
]
[project.optional-dependencies]
dev = ["pytest>=8.3", "ruff>=0.9"]
reports = ["matplotlib>=3.10"]
[project.scripts]
solstice = "research.cli:main"
[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["research"]
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
[tool.ruff]
line-length = 110
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B"]
