name: Research checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: python -m pip install uv
      - run: uv sync --frozen --extra dev --no-editable
      - run: uv run --frozen --no-editable ruff check research tests/test_v6* scripts/*.py
      - run: uv run --frozen --no-editable pytest
      - run: uv run --frozen --no-editable solstice plan --config configs/mac.toml
      - run: uv run --frozen --no-editable python -m py_compile solstice.py config.py validation.py
