name: Research checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - run: pip install -r requirements-checks.txt
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile solstice.py config.py validation.py
